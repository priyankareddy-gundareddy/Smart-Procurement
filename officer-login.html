<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SmartProcure | Officer Login</title>

    <link rel="stylesheet" href="style.css">
</head>

<body class="admin-body">

<main class="admin-main">

    <section class="admin-hero">

        <header class="admin-topbar">

            <a class="admin-hero-brand" href="index.html">
                <span class="admin-brand-mark">S</span>
                <strong>Smart<span>Procure</span></strong>
            </a>

        </header>

        <div class="admin-welcome">
            <h1>Officer Login</h1>
            <p>Login to manage the procurement queue.</p>
        </div>

    </section>


    <section class="admin-page-content">

        <div class="admin-form-card">

            <h2>Officer Login</h2>

            <form id="officer-login-form">

                <div class="admin-form-group">

                    <label for="officer-email">
                        Email
                    </label>

                    <input
                            type="email"
                            id="officer-email"
                            placeholder="Enter email"
                            required
                    >

                </div>


                <div class="admin-form-group">

                    <label for="officer-password">
                        Password
                    </label>

                    <input
                            type="password"
                            id="officer-password"
                            placeholder="Enter password"
                            required
                    >

                </div>


                <button
                        type="submit"
                        class="admin-primary-button">
                    Login
                </button>

            </form>

            <p id="officer-login-message"></p>

        </div>

    </section>

</main>


<script src="officer-login.js"></script>

</body>
</html>
