<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartProcure | Admin Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=admin-auth-3">
</head>
<body class="admin-login-body">
  <main class="admin-login-shell">
    <section class="admin-login-card" aria-labelledby="admin-login-title">
      <a class="admin-login-brand" href="index.html" aria-label="SmartProcure home"><span class="admin-brand-mark">S</span><span>Smart<span>Procure</span></span></a>
      <span class="admin-eyebrow">Restricted access</span>
      <h1 id="admin-login-title">Admin Login</h1>
      <p class="admin-login-lede">Sign in to manage farmers, procurement requests, centers, and slots.</p>
      <form id="admin-login-form" novalidate>
        <label for="admin-username">Admin Email</label>
        <input id="admin-username" name="username" type="email" autocomplete="username" placeholder="Enter admin email" required>
        <label for="admin-password">Password</label>
        <input id="admin-password" name="password" type="password" autocomplete="current-password" placeholder="Enter admin password" required>
        <p class="admin-login-error" id="admin-login-error" role="alert" aria-live="polite"></p>
        <button class="admin-login-submit" type="submit">Login to Admin Dashboard <span>→</span></button>
      </form>
      <p class="admin-login-register">Don't have an account? <a href="admin-register.html">Register</a></p>
      <a class="admin-login-back" href="index.html#login-selection">← Back to Login Selection</a>
    </section>
  </main>
  <script src="admin-auth.js?v=admin-auth-3"></script>
</body>
</html>
