<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartProcure | Admin Registration</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=admin-auth-3">
</head>
<body class="admin-login-body">
  <main class="admin-login-shell">
    <section class="admin-login-card" aria-labelledby="admin-register-title">
      <a class="admin-login-brand" href="index.html" aria-label="SmartProcure home"><span class="admin-brand-mark">S</span><span>Smart<span>Procure</span></span></a>
      <span class="admin-eyebrow">Create admin access</span>
    C  <h1 id="admin-register-title">Admin Registration</h1>
      <p class="admin-login-lede">Create an account to manage the SmartProcure platform.</p>
      <form id="admin-register-form" novalidate>
        <label for="admin-name">Admin Name</label>
        <input id="admin-name" name="name" type="text" autocomplete="name" placeholder="Enter admin name" required>
        <label for="admin-email">Email</label>
        <input id="admin-email" name="email" type="email" autocomplete="email" placeholder="Enter admin email" required>
        <label for="admin-register-password">Password</label>
        <input id="admin-register-password" name="password" type="password" autocomplete="new-password" placeholder="At least 6 characters" minlength="6" required>
        <label for="admin-confirm-password">Confirm Password</label>
        <input id="admin-confirm-password" name="confirmPassword" type="password" autocomplete="new-password" placeholder="Confirm your password" required>
        <label for="admin-registration-code">Admin Registration Code</label>
        <input id="admin-registration-code" name="registrationCode" type="password" autocomplete="off" placeholder="Enter authorization code" required>
        <p class="admin-login-error" id="admin-register-error" role="alert" aria-live="polite"></p>
        <p class="admin-login-success" id="admin-register-success" role="status" aria-live="polite"></p>
        <button class="admin-login-submit" type="submit">Register Admin <span>→</span></button>
      </form>
      <p class="admin-login-register">Already have an account? <a href="admin-login.html">Login</a></p>
      <a class="admin-login-back" href="index.html#login-selection">← Back to Login Selection</a>
    </section>
  </main>
  <script src="admin-auth.js?v=admin-auth-3"></script>
  <script src="translations/admin-en.js?v=admin-language-1"></script><script src="translations/admin-te.js?v=admin-language-1"></script><script src="js/admin-i18n.js?v=admin-language-1"></script>
</body>
</html>
